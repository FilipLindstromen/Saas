<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaConnect – Run or deploy</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #fff;
      padding: 1.5rem;
    }
    .card {
      max-width: 440px;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    p { color: rgba(255,255,255,0.75); margin: 0 0 1.5rem; font-size: 0.9375rem; line-height: 1.6; }
    a {
      display: inline-block;
      padding: 0.6rem 1.25rem;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
      margin: 0.25rem;
      font-size: 0.9375rem;
    }
    .btn-primary {
      background: #2563eb;
      color: #fff;
      border: none;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary {
      background: transparent;
      color: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .btn-secondary:hover { border-color: #2563eb; color: #fff; }
    .features {
      text-align: left;
      margin: 1rem 0 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .feature {
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      font-size: 0.8125rem;
      color: rgba(255,255,255,0.8);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
    </div>
    <h1>MetaConnect</h1>
    <p>Automate Facebook &amp; Instagram comment-to-DM flows and sync lead form submissions to Systeme.io.</p>
    <div class="features">
      <div class="feature">💬 Comment keyword DMs</div>
      <div class="feature">📋 Lead form sync</div>
      <div class="feature">📘 Facebook &amp; Instagram</div>
      <div class="feature">🔗 Systeme.io CRM</div>
    </div>
    <a href="__METACONNECT_APP_URL__" class="btn-primary" target="_blank" rel="noopener">Open MetaConnect</a>
    <a href="../" class="btn-secondary">Back to Saas Apps</a>
  </div>
</body>
</html>
