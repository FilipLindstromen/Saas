<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypoAnimation – Run or deploy</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #fff;
      padding: 1.5rem;
    }
    .card {
      max-width: 460px;
      width: 100%;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      margin: 0 auto 1rem;
      background: #ec3013;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 900;
      font-size: 30px;
      color: #f3f2f2;
    }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    p.sub { color: rgba(255,255,255,0.7); margin: 0 0 1.25rem; font-size: 0.9375rem; line-height: 1.6; }
    .features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .feature {
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      font-size: 0.8125rem;
      color: rgba(255,255,255,0.8);
      text-align: left;
    }
    a, button {
      display: inline-block;
      padding: 0.6rem 1.25rem;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      margin: 0.25rem;
      font-size: 0.9375rem;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: #ec3013;
      color: #fff;
    }
    .btn-primary:hover { background: #c9260f; }
    .btn-secondary {
      background: transparent;
      color: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.2) !important;
    }
    .btn-secondary:hover { border-color: #ec3013 !important; color: #fff; }
    .notice {
      background: rgba(236,48,19,0.12);
      border: 1px solid rgba(236,48,19,0.35);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      font-size: 0.8375rem;
      color: rgba(255,255,255,0.75);
      text-align: left;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }
    .notice strong { color: #ff9d85; }
    code {
      background: rgba(255,255,255,0.08);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.8em;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">A</div>
    <h1>TypoAnimation</h1>
    <p class="sub">Paste a script, pick a style/color per scene, and generate a kinetic-typography VSL video — synced to an uploaded webcam voiceover.</p>

    <div class="features">
      <div class="feature">✍️ Script → scenes</div>
      <div class="feature">🎨 Style &amp; color per scene</div>
      <div class="feature">🎙️ Webcam voice sync</div>
      <div class="feature">🎬 MP4 export</div>
    </div>

    <div id="app-section">
      <!-- Injected by build: either open-btn or not-deployed notice -->
    </div>

    <a href="../" class="btn-secondary">← Back to Saas Apps</a>
  </div>

  <script>
    const url = "__TYPOANIMATION_APP_URL__";
    const section = document.getElementById("app-section");

    if (url && url !== "#" && url !== "__TYPOANIMATION_APP_URL__") {
      section.innerHTML = `<a href="${url}" class="btn-primary" target="_blank" rel="noopener">Open TypoAnimation →</a>`;
    } else {
      section.innerHTML = `
        <div class="notice">
          <strong>Not yet deployed.</strong> TypoAnimation is a server-side Next.js app (ffmpeg + local speech-to-text + video rendering) — run it locally for now, or give it its own deployment.<br><br>
          To run locally:
          <ol style="margin:0.5rem 0 0 1.1rem;padding:0;text-align:left">
            <li>In the <code>TypoAnimation/</code> folder: <code>npm install</code></li>
            <li><code>npm run dev</code>, then open <code>localhost:3000</code></li>
          </ol>
          To deploy and link it here: import <code>TypoAnimation/</code> as its own Vercel project, then add a GitHub secret named <code>TYPOANIMATION_APP_URL</code> with the deployed URL and re-run this GitHub Pages deployment.
        </div>
      `;
    }
  </script>
</body>
</html>
