<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pitch Deck Generator</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Runs before the app module: clears corrupt PitchDeck data when the UI cannot mount. -->
    <script>
      (function () {
        try {
          if (!/\bpitchDeckEmergencyReset=1\b/.test(location.search)) return
          var toRemove = []
          var i
          for (i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i)
            if (k && k.indexOf('pitchDeck') === 0) toRemove.push(k)
          }
          for (i = 0; i < toRemove.length; i++) localStorage.removeItem(toRemove[i])
          try {
            localStorage.removeItem('analysisFolded')
          } catch (e2) {}
          try {
            indexedDB.deleteDatabase('PitchDeckProjectFolder')
          } catch (e3) {}
          var u = new URL(location.href)
          u.searchParams.delete('pitchDeckEmergencyReset')
          location.replace(u.pathname + u.search + u.hash)
        } catch (e) {
          console.warn('pitchDeckEmergencyReset:', e)
        }
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
