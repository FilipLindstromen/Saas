<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recording — Crime Scene</title>
  <style>
    :root {
      --bg: #0a0a0a; --bg2: #111; --surface: #141414; --surface2: #1c1c1c;
      --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.13);
      --text: rgba(255,255,255,0.92); --muted: rgba(255,255,255,0.4);
      --accent: #4cff91;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 2rem;
    }

    #back-btn {
      position: fixed; top: 18px; left: 18px; z-index: 20;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(12px);
      border: 1px solid var(--border); color: var(--muted);
      padding: 8px 14px; border-radius: 8px; font-size: 13px;
      cursor: pointer; text-decoration: none;
      display: flex; align-items: center; gap: 6px;
      transition: background 0.2s, color 0.2s;
    }
    #back-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }

    /* ── Player card ── */
    .player-card {
      width: 100%; max-width: 540px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      display: flex; flex-direction: column;
    }

    /* ── Visualizer canvas ── */
    #viz-wrap {
      position: relative;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      line-height: 0;
    }
    #viz-canvas {
      width: 100%; height: 140px; display: block;
    }
    /* idle state: dim pulsing ring behind the canvas */
    #viz-idle {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; transition: opacity 0.4s;
    }
    #viz-idle.hidden { opacity: 0; }
    .idle-ring {
      width: 48px; height: 48px; border-radius: 50%;
      border: 1.5px solid rgba(76,255,145,0.25);
      animation: ring-pulse 2.4s ease-in-out infinite;
    }
    .idle-ring:nth-child(2) { position: absolute; width: 70px; height: 70px; animation-delay: 0.6s; }
    .idle-ring:nth-child(3) { position: absolute; width: 96px; height: 96px; animation-delay: 1.2s; }
    @keyframes ring-pulse {
      0%,100% { opacity: 0.5; transform: scale(1); }
      50%      { opacity: 0.12; transform: scale(1.06); }
    }
    .idle-icon {
      position: absolute;
      color: rgba(76,255,145,0.4);
    }

    /* ── Meta ── */
    .meta { padding: 1.5rem 1.5rem 0.5rem; }
    .badge {
      display: inline-block;
      font-size: 10px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--accent);
      border: 1px solid rgba(76,255,145,0.25);
      padding: 3px 10px; border-radius: 4px;
      margin-bottom: 12px;
    }
    #scene-title { font-size: 1.4rem; font-weight: 700; line-height: 1.2; margin-bottom: 6px; }
    #scene-body  { font-size: 13px; color: var(--muted); line-height: 1.6; }

    /* ── Progress ── */
    .progress-section { padding: 1.25rem 1.5rem 0; display: flex; flex-direction: column; gap: 8px; }
    #progress-wrap {
      position: relative; height: 3px; background: rgba(255,255,255,0.08);
      border-radius: 2px; cursor: pointer; transition: height 0.15s;
    }
    #progress-wrap:hover { height: 5px; }
    #progress-fill {
      height: 100%; background: var(--accent); border-radius: 2px;
      width: 0%; transition: width 0.08s linear; pointer-events: none;
    }
    .time-row {
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
    }

    /* ── Controls ── */
    .controls { padding: 1rem 1.5rem 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }
    .controls-row { display: flex; align-items: center; justify-content: center; gap: 16px; }

    .ctrl-btn {
      background: none; border: none; color: var(--text); cursor: pointer;
      padding: 8px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; transition: background 0.15s; flex-shrink: 0;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.07); }

    #play-btn {
      width: 60px; height: 60px; border-radius: 50%; border: none;
      background: var(--accent); color: #000; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, box-shadow 0.3s;
      box-shadow: 0 0 0 rgba(76,255,145,0);
      flex-shrink: 0;
    }
    #play-btn:hover { transform: scale(1.06); }
    #play-btn.playing {
      box-shadow: 0 0 28px rgba(76,255,145,0.35), 0 0 60px rgba(76,255,145,0.12);
    }

    /* ── Volume ── */
    .volume-row { display: flex; align-items: center; gap: 10px; }
    .volume-row svg { opacity: 0.4; flex-shrink: 0; }
    #volume-slider {
      flex: 1; -webkit-appearance: none; appearance: none;
      height: 3px; background: rgba(255,255,255,0.12);
      border-radius: 2px; outline: none; cursor: pointer;
    }
    #volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      background: white; border-radius: 50%;
    }

    /* ── Loading / Error ── */
    #loading, #error-screen {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; z-index: 100;
    }
    #loading.gone { display: none; }
    #error-screen { display: none; }
    #error-screen.show { display: flex; }
    .spinner { width: 28px; height: 28px; border: 2px solid rgba(255,255,255,0.08); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg { font-size: 12px; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; }
    .err-link { font-size: 13px; color: var(--accent); text-decoration: none; margin-top: 6px; }
  </style>
</head>
<body>

<div id="loading"><div class="spinner"></div><div class="msg">Loading</div></div>
<div id="error-screen">
  <div class="msg" id="error-title">Not Found</div>
  <div style="font-size:13px;color:rgba(255,255,255,0.25);margin-top:4px" id="error-msg"></div>
  <a class="err-link" href="../">← Back to Crime Scene</a>
</div>

<a id="back-btn" href="../">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
  Back
</a>

<div class="player-card" id="player-card" style="display:none">

  <!-- Visualizer -->
  <div id="viz-wrap">
    <canvas id="viz-canvas"></canvas>
    <div id="viz-idle">
      <div class="idle-ring"></div>
      <div class="idle-ring"></div>
      <div class="idle-ring"></div>
      <div class="idle-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Meta -->
  <div class="meta">
    <div class="badge">Recording</div>
    <div id="scene-title"></div>
    <div id="scene-body"></div>
  </div>

  <!-- Progress -->
  <div class="progress-section">
    <div id="progress-wrap"><div id="progress-fill"></div></div>
    <div class="time-row">
      <span id="time-current">0:00</span>
      <span id="time-total">0:00</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="controls-row">
      <button class="ctrl-btn" id="skip-back-btn" title="−10s">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M2.5 12a9.5 9.5 0 1 1 1.1 4.5"/>
          <polyline points="2 7 2 12 7 12"/>
          <text x="8.5" y="14" style="font-size:5.5px;fill:currentColor;stroke:none;font-weight:600">10</text>
        </svg>
      </button>

      <button id="play-btn" title="Play / Pause">
        <svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
      </button>

      <button class="ctrl-btn" id="skip-fwd-btn" title="+10s">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21.5 12a9.5 9.5 0 1 0-1.1 4.5"/>
          <polyline points="22 7 22 12 17 12"/>
          <text x="8.5" y="14" style="font-size:5.5px;fill:currentColor;stroke:none;font-weight:600">10</text>
        </svg>
      </button>
    </div>

    <div class="volume-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
      </svg>
      <input type="range" id="volume-slider" min="0" max="1" step="0.02" value="1">
    </div>
  </div>
</div>

<audio id="audio-el" preload="metadata" crossorigin="anonymous"></audio>

<script>
  const audio     = document.getElementById('audio-el');
  const playBtn   = document.getElementById('play-btn');
  const playIcon  = document.getElementById('play-icon');
  const progFill  = document.getElementById('progress-fill');
  const progWrap  = document.getElementById('progress-wrap');
  const timeCur   = document.getElementById('time-current');
  const timeTot   = document.getElementById('time-total');
  const volSlider = document.getElementById('volume-slider');
  const vizIdle   = document.getElementById('viz-idle');

  const PLAY_SVG  = '<polygon points="5,3 19,12 5,21"/>';
  const PAUSE_SVG = '<rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/>';

  function fmt(s) {
    if (!isFinite(s)) return '0:00';
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return `${m}:${sec.toString().padStart(2,'0')}`;
  }

  // ── Canvas visualizer ────────────────────────────────────────────
  const canvas = document.getElementById('viz-canvas');
  const ctx2d  = canvas.getContext('2d');
  let analyser = null, freqData = null, timeData = null;
  let vizRaf   = null;
  let audioCtx = null;
  let sourceConnected = false;

  function setupAudioContext() {
    if (sourceConnected) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      audioCtx = new AC();
      const src = audioCtx.createMediaElementSource(audio);
      analyser  = audioCtx.createAnalyser();
      analyser.fftSize              = 1024;
      analyser.smoothingTimeConstant = 0.75;
      analyser.minDecibels          = -85;
      analyser.maxDecibels          = -25;
      src.connect(analyser);
      analyser.connect(audioCtx.destination); // still need audio to come out
      freqData = new Uint8Array(analyser.frequencyBinCount);
      timeData = new Uint8Array(analyser.fftSize);
      sourceConnected = true;
      return true;
    } catch(e) {
      console.warn('AudioContext setup failed:', e);
      return false;
    }
  }

  function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr  = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = rect.width  * dpr;
    canvas.height = rect.height * dpr;
    ctx2d.scale(dpr, dpr);
  }

  function drawIdle() {
    if (!ctx2d) return;
    const W = canvas.width  / (Math.min(window.devicePixelRatio || 1, 2));
    const H = canvas.height / (Math.min(window.devicePixelRatio || 1, 2));
    ctx2d.clearRect(0, 0, W, H);
    ctx2d.fillStyle = '#111';
    ctx2d.fillRect(0, 0, W, H);
    // flat centre line
    ctx2d.strokeStyle = 'rgba(76,255,145,0.15)';
    ctx2d.lineWidth = 1.5;
    ctx2d.beginPath();
    ctx2d.moveTo(0, H / 2);
    ctx2d.lineTo(W, H / 2);
    ctx2d.stroke();
  }

  function drawFrame() {
    if (!analyser || !ctx2d) return;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W   = canvas.width  / dpr;
    const H   = canvas.height / dpr;

    // clear
    ctx2d.fillStyle = '#111';
    ctx2d.fillRect(0, 0, W, H);

    // ── Frequency bars (rising from bottom, semi-transparent) ──
    analyser.getByteFrequencyData(freqData);
    const barCount = Math.min(64, Math.floor(W / 5));
    const step     = Math.max(1, Math.floor(freqData.length / barCount));
    const gap      = 2;
    const barW     = Math.max(2, W / barCount - gap);

    for (let i = 0; i < barCount; i++) {
      const v       = freqData[i * step] ?? 0;
      const boosted = Math.min(255, v * 1.4 + 6);
      const h       = Math.max(1.5, (boosted / 255) * (H * 0.8));
      const alpha   = 0.25 + (boosted / 255) * 0.45;

      // gradient fill per bar
      const grad = ctx2d.createLinearGradient(0, H - h, 0, H);
      grad.addColorStop(0, `rgba(76,255,145,${alpha})`);
      grad.addColorStop(1, `rgba(76,255,145,0.05)`);
      ctx2d.fillStyle = grad;
      ctx2d.beginPath();
      ctx2d.roundRect
        ? ctx2d.roundRect(i * (W / barCount) + gap / 2, H - h, barW, h, 2)
        : ctx2d.rect(i * (W / barCount) + gap / 2, H - h, barW, h);
      ctx2d.fill();
    }

    // ── Time-domain waveform line ──
    analyser.getByteTimeDomainData(timeData);

    // glow pass (wider, dimmer)
    ctx2d.lineWidth   = 4;
    ctx2d.strokeStyle = 'rgba(76,255,145,0.18)';
    ctx2d.lineCap     = 'round';
    ctx2d.lineJoin    = 'round';
    ctx2d.beginPath();
    const sliceW = W / timeData.length;
    for (let i = 0; i < timeData.length; i++) {
      const v    = timeData[i] ?? 128;
      const norm = (v - 128) / 128;
      const x    = i * sliceW;
      const y    = H / 2 - norm * (H / 2) * 0.88;
      i === 0 ? ctx2d.moveTo(x, y) : ctx2d.lineTo(x, y);
    }
    ctx2d.stroke();

    // sharp pass
    ctx2d.lineWidth   = 2;
    ctx2d.strokeStyle = 'rgba(76,255,145,0.92)';
    ctx2d.beginPath();
    for (let i = 0; i < timeData.length; i++) {
      const v    = timeData[i] ?? 128;
      const norm = (v - 128) / 128;
      const x    = i * sliceW;
      const y    = H / 2 - norm * (H / 2) * 0.88;
      i === 0 ? ctx2d.moveTo(x, y) : ctx2d.lineTo(x, y);
    }
    ctx2d.stroke();

    // centre grid line (very faint)
    ctx2d.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx2d.lineWidth   = 1;
    ctx2d.beginPath();
    ctx2d.moveTo(0, H / 2);
    ctx2d.lineTo(W, H / 2);
    ctx2d.stroke();
  }

  function startViz() {
    if (vizRaf) return;
    function loop() {
      drawFrame();
      vizRaf = requestAnimationFrame(loop);
    }
    vizRaf = requestAnimationFrame(loop);
  }

  function stopViz() {
    if (vizRaf) { cancelAnimationFrame(vizRaf); vizRaf = null; }
    drawIdle();
  }

  // ── Playback controls ────────────────────────────────────────────
  async function togglePlay() {
    if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
    audio.paused ? audio.play() : audio.pause();
  }

  playBtn.addEventListener('click', togglePlay);
  audio.addEventListener('play', () => {
    playIcon.innerHTML = PAUSE_SVG;
    playBtn.classList.add('playing');
    vizIdle.classList.add('hidden');
    if (setupAudioContext()) startViz();
  });
  audio.addEventListener('pause', () => {
    playIcon.innerHTML = PLAY_SVG;
    playBtn.classList.remove('playing');
    stopViz();
  });
  audio.addEventListener('ended', () => {
    playIcon.innerHTML = PLAY_SVG;
    playBtn.classList.remove('playing');
    stopViz();
    vizIdle.classList.remove('hidden');
  });

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    progFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
    timeCur.textContent  = fmt(audio.currentTime);
  });

  progWrap.addEventListener('click', e => {
    if (!audio.duration) return;
    const rect = progWrap.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  });

  volSlider.addEventListener('input', () => { audio.volume = volSlider.value; });
  document.getElementById('skip-back-btn').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
  document.getElementById('skip-fwd-btn').addEventListener('click',  () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); });

  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); togglePlay(); }
    if (e.key === 'ArrowRight') audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
    if (e.key === 'ArrowLeft')  audio.currentTime = Math.max(0, audio.currentTime - 5);
  });

  // ── Resize ───────────────────────────────────────────────────────
  const ro = new ResizeObserver(() => { resizeCanvas(); if (!vizRaf) drawIdle(); });
  ro.observe(canvas.parentElement);

  // ── Init ─────────────────────────────────────────────────────────
  function showError(title, msg) {
    document.getElementById('loading').classList.add('gone');
    document.getElementById('error-title').textContent = title;
    document.getElementById('error-msg').textContent   = msg || '';
    document.getElementById('error-screen').classList.add('show');
  }

  async function init() {
    const slug = location.search.slice(1);
    if (!slug) { showError('No Recording Specified', 'Add a ?slug to the URL.'); return; }

    let manifest;
    try {
      const res = await fetch('../manifest.json');
      if (!res.ok) throw new Error();
      manifest  = await res.json();
    } catch {
      const s = localStorage.getItem('crimescene-manifest');
      if (s) manifest = JSON.parse(s);
      else { showError('Manifest Not Found'); return; }
    }

    const item = (manifest.items || []).find(i => i.slug === slug && i.type === 'recording');
    if (!item) { showError('Recording Not Found', `No recording named "${slug}".`); return; }

    document.title = `${item.title} — Crime Scene`;
    document.getElementById('scene-title').textContent = item.title;
    if (item.body) document.getElementById('scene-body').textContent = item.body;

    audio.src = item.file;
    audio.load();
    audio.addEventListener('loadedmetadata', () => {
      timeTot.textContent = fmt(audio.duration);
      document.getElementById('loading').classList.add('gone');
      const card = document.getElementById('player-card');
      card.style.display = '';
      resizeCanvas();
      drawIdle();
    });
    audio.addEventListener('error', () => showError('Load Error', 'Could not load the audio file.'));
  }

  init();
</script>
</body>
</html>
