<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crime Scene</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1c1c1c;
      --border: rgba(255,255,255,0.08);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.45);
      --accent: #ff6b35;
      --watch-color: #4caaff;
      --video-color: #a78bfa;
      --audio-color: #4cff91;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ── Top bar ── */
    .topbar {
      position: sticky; top: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem;
      height: 56px;
      background: rgba(10,10,10,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      z-index: 50;
    }
    .topbar-logo {
      font-size: 13px; font-weight: 700; letter-spacing: 4px;
      text-transform: uppercase; color: var(--text);
      text-decoration: none;
    }
    .topbar-logo span { color: var(--accent); }
    .topbar-actions { display: flex; gap: 10px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
      cursor: pointer; text-decoration: none; border: none;
      transition: all 0.15s;
    }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-ghost:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #ff8555; }

    /* ── Hero ── */
    .hero {
      padding: 5rem 2rem 3rem;
      text-align: center;
    }
    .hero-eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: 5px;
      text-transform: uppercase; color: var(--accent);
      margin-bottom: 1rem;
    }
    .hero-title {
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 800; letter-spacing: -1px; line-height: 1;
      margin-bottom: 1.25rem;
    }
    .hero-sub {
      font-size: 1rem; color: var(--muted); max-width: 420px; margin: 0 auto;
      line-height: 1.6;
    }

    /* ── Content ── */
    .container { max-width: 1100px; margin: 0 auto; padding: 0 2rem 4rem; }

    .section { margin-bottom: 3rem; }
    .section-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .section-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .section-title { font-size: 13px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; }
    .section-count { font-size: 12px; color: var(--muted); margin-left: auto; }

    /* ── Cards ── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: flex; flex-direction: column;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(255,255,255,0.15);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .card-thumb {
      aspect-ratio: 16/9;
      background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    .card-thumb-icon { font-size: 2rem; opacity: 0.25; }
    .card-type-badge {
      position: absolute; top: 10px; left: 10px;
      font-size: 10px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; padding: 3px 8px; border-radius: 4px;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
    }
    .card-body { padding: 1rem 1.125rem 1.25rem; flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .card-title { font-size: 15px; font-weight: 600; }
    .card-desc { font-size: 13px; color: var(--muted); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* ── Type colors ── */
    [data-type="watch"] .section-dot { background: var(--watch-color); }
    [data-type="watch"] .card-type-badge { color: var(--watch-color); border: 1px solid rgba(76,170,255,0.3); }
    [data-type="watch"] .card-thumb-icon::before { content: '⬤'; }
    [data-type="watch"] .card:hover { border-color: rgba(76,170,255,0.3); }

    [data-type="video"] .section-dot { background: var(--video-color); }
    [data-type="video"] .card-type-badge { color: var(--video-color); border: 1px solid rgba(167,139,250,0.3); }
    [data-type="video"] .card-thumb-icon::before { content: '▶'; }
    [data-type="video"] .card:hover { border-color: rgba(167,139,250,0.3); }

    [data-type="recording"] .section-dot { background: var(--audio-color); }
    [data-type="recording"] .card-type-badge { color: var(--audio-color); border: 1px solid rgba(76,255,145,0.3); }
    [data-type="recording"] .card-thumb-icon::before { content: '🎙'; }
    [data-type="recording"] .card:hover { border-color: rgba(76,255,145,0.3); }

    /* ── Empty state ── */
    .empty {
      grid-column: 1/-1;
      padding: 2.5rem;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      border: 1px dashed var(--border);
      border-radius: 14px;
    }

    /* ── Loading ── */
    #loading-overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; transition: opacity 0.4s;
    }
    #loading-overlay.gone { opacity: 0; pointer-events: none; }
    .spinner {
      width: 32px; height: 32px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="loading-overlay"><div class="spinner"></div></div>

<nav class="topbar">
  <a class="topbar-logo" href="#"><span>Crime</span> Scene</a>
  <div class="topbar-actions">
    <a href="admin/" class="btn btn-ghost">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Admin
    </a>
  </div>
</nav>

<div class="hero">
  <p class="hero-eyebrow">Immersive Media</p>
  <h1 class="hero-title">Crime Scene</h1>
  <p class="hero-sub">Explore immersive 360° scenes, videos, and audio recordings.</p>
</div>

<div class="container">
  <section class="section" data-type="watch">
    <div class="section-header">
      <span class="section-dot"></span>
      <span class="section-title">360° Watch</span>
      <span class="section-count" id="watch-count"></span>
    </div>
    <div class="grid" id="watch-grid"></div>
  </section>

  <section class="section" data-type="video">
    <div class="section-header">
      <span class="section-dot"></span>
      <span class="section-title">Video</span>
      <span class="section-count" id="video-count"></span>
    </div>
    <div class="grid" id="video-grid"></div>
  </section>

  <section class="section" data-type="recording">
    <div class="section-header">
      <span class="section-dot"></span>
      <span class="section-title">Recordings</span>
      <span class="section-count" id="recording-count"></span>
    </div>
    <div class="grid" id="recording-grid"></div>
  </section>
</div>

<script>
  const TYPE_LABEL = { watch: '360°', video: 'Video', recording: 'Audio' };
  const TYPE_ICON  = { watch: '⬤',   video: '▶',    recording: '🎙' };

  function makeCard(item) {
    const a = document.createElement('a');
    a.href  = `${item.type}/?${item.slug}`;
    a.className = 'card';
    a.innerHTML = `
      <div class="card-thumb">
        <span class="card-thumb-icon">${TYPE_ICON[item.type] || ''}</span>
        <span class="card-type-badge">${TYPE_LABEL[item.type] || item.type}</span>
      </div>
      <div class="card-body">
        <div class="card-title">${item.title || item.slug}</div>
        ${item.body ? `<div class="card-desc">${item.body}</div>` : ''}
      </div>`;
    return a;
  }

  function renderSection(type, items) {
    const grid  = document.getElementById(`${type}-grid`);
    const count = document.getElementById(`${type}-count`);
    grid.innerHTML = '';
    if (!items.length) {
      grid.innerHTML = '<div class="empty">No content yet — add some in the Admin panel.</div>';
      if (count) count.textContent = '';
    } else {
      items.forEach(item => grid.appendChild(makeCard(item)));
      if (count) count.textContent = items.length;
    }
  }

  async function init() {
    let manifest;
    try {
      const res = await fetch('manifest.json');
      manifest  = await res.json();
    } catch {
      const stored = localStorage.getItem('crimescene-manifest');
      manifest = stored ? JSON.parse(stored) : { items: [] };
    }

    const byType = { watch: [], video: [], recording: [] };
    (manifest.items || []).forEach(item => {
      if (byType[item.type]) byType[item.type].push(item);
    });

    renderSection('watch',     byType.watch);
    renderSection('video',     byType.video);
    renderSection('recording', byType.recording);

    const overlay = document.getElementById('loading-overlay');
    overlay.classList.add('gone');
    setTimeout(() => overlay.remove(), 500);
  }

  init();
</script>
</body>
</html>
