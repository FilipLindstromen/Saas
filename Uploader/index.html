    <style>
      /* CSS variable aliases so AutoCaptions-derived components work with Uploader theme */
      :root, [data-theme="dark"] {
        --card-radius: var(--radius-lg);
        --button-radius: var(--radius);
        --border-default: var(--border);
        --border-strong: rgba(255,255,255,0.14);
        --bg-active: #2a2a2a;
        --text-on-accent: #fff;
        --accent-hover: #ff8555;

      [data-theme="light"] {
        --card-radius: var(--radius-lg);
        --button-radius: var(--radius);
        --border-default: var(--border);
        --border-strong: rgba(0,0,0,0.12);
        --bg-active: #d8d8d8;
        --text-on-accent: #fff;
        --accent-hover: #e55a2b;
